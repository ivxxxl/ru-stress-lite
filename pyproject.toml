[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-stress-lite"
version = "0.1.0"
description = "Ударения в русском тексте по словарю на 3,2 млн слов — без нейросети и гигабайтов памяти (+ фикс ударений для Piper TTS)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["russian", "stress", "accent", "tts", "piper", "ударение"]
classifiers = ["Natural Language :: Russian", "Programming Language :: Python :: 3", "Topic :: Text Processing :: Linguistic"]

[project.optional-dependencies]
piper = ["piper-tts"]
test = ["pytest"]

[project.scripts]
rustress = "rustress.__main__:main"
rustress-build = "rustress.build:main"

[tool.setuptools]
packages = ["rustress"]
